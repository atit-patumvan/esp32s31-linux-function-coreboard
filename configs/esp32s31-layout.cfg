# Derived from Espressif esp-linux-bsp commit
# a77a06f03068d25799ddd719566df50207f28c5a.
# Modified for the SMP/XIP/SquashFS/persistent-storage layout.
#
# ESP32-S31 NOR layout shared by image packaging and partial flash targets.
# Keep this file shell-compatible: tools/gen_esp_flash_image.sh and the
# Makefile flash recipes source it directly.

CHIP=esp32s31
SPL_SRAM_ADDR=0x2F040000
ESPTOOL_FLASH="--flash-mode dio --flash-freq 80m --flash-size 16MB"

# Raw flash slots.  The merged recovery image contains 0xff padding across
# persist and therefore resets it.  The segmented flash-all target omits the
# persist slot so routine firmware updates preserve user data.
SLOT_SPL=0x002000
SLOT_UBOOT_ITB=0x100000
SLOT_DTB=0x300000
SLOT_KERNEL=0x500000
SLOT_PERSIST=0xB00000
SLOT_ROOTFS=0xC00000
FLASH_SIZE=0x1000000

# Artifact names within build/.
SPL_DTB_BIN=u-boot-spl-dtb.bin
SPL_APP_BIN=spl_app.bin
UBOOT_ITB=u-boot.itb
BASE_DTB=esp32s31_generic.dtb
KERNEL_IMAGE=xipImage
PERSIST_IMAGE=persist.jffs2
ROOTFS_IMAGE=rootfs.sqfs
OUT_IMAGE=s31_full_flash.bin
