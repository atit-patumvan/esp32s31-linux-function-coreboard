# The automatic TCP thresholds derived from 16 MiB of RAM are only
# 696/932/1392 KiB. A single 1 MiB receive-autotuned Wi-Fi socket can enter
# global memory pressure once skb truesize and an AMPDU out-of-order burst are
# accounted. Keep the per-socket cap at 1 MiB, but leave enough global room
# for one bulk flow without consuming most of the machine.
net.ipv4.tcp_mem = 512 1024 1536
net.ipv4.tcp_rmem = 4096 131072 1048576
net.core.rmem_max = 1048576
